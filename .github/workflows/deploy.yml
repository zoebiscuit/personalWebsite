name: Deploy to zoebisset.com

# Every push to main publishes the site. You can also run it by hand from
# the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# If two pushes land close together, finish one deploy before starting the next.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish to the server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's real identity, so we never talk to an impostor.
          echo "134.209.77.1 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDMd3nccgpbBEbUV+gycx2ij/JBnBwihvTtvqhsJlz30" > ~/.ssh/known_hosts
          # This key can only run the deploy script on the server, nothing else.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@134.209.77.1
